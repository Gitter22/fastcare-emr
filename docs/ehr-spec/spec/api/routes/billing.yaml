tag: Billing
description: Revenue cycle — eligibility, estimates, payments, charge review, claims (states.yaml#claim) via Stedi, ERA posting, denials and appeals, statements, patient accounts, payment plans and day close. The ledger is append-only and balances are derived (INV-FIN-01/02). Billing roles never receive clinical note text (INV-SEC-05).
defaults: {auth: staff, roles: [biller, manager], audit: READ}
ops:
  - {id: listEligibilityWorklist, m: GET, p: "/eligibility", sum: "Upcoming visits with eligibility status, copay, deductible and auth needs", q: [fromDate, toDate, status, locationId], res: "page:EligibilityRow", roles: [frontdesk, biller, manager], screens: [billing.eligibility, home.frontdesk-board]}
  - {id: runEligibilityBatch, m: POST, p: "/eligibility/batches", sum: "Run a 270 batch now for a date range", body: DateRangeRequest, res: job, roles: [frontdesk, biller, manager], screens: [billing.eligibility], flows: ["flow:access/03"], integ: ClearinghouseGateway, audit: QUERY}

  - {id: listEstimates, m: GET, p: "/estimates", sum: "Good-faith estimates", q: [patientId, status], res: "page:Estimate", roles: [frontdesk, biller, manager], screens: [billing.estimates]}
  - {id: createEstimate, m: POST, p: "/estimates", sum: "Create an estimate from the self-pay fee schedule", body: "create:Estimate", res: "created:Estimate", roles: [frontdesk, biller, manager], screens: [billing.estimates, patients.registration], audit: CREATE}
  - {id: sendEstimate, m: POST, p: "/estimates/{estimateId}/send", sum: "Send to portal/email", res: Estimate, roles: [frontdesk, biller, manager], screens: [billing.estimates], integ: MessagingGateway, audit: DISCLOSE}

  - {id: getPatientBalance, m: GET, p: "/patients/{patientId}/balance", sum: "Derived balance by visit, insurance pending, credit", res: PatientBalance, roles: [frontdesk, biller, manager], screens: [billing.payment-capture, chart.account, home.frontdesk-board, schedule.checkout], inv: [INV-FIN-02]}
  - {id: createPayment, m: POST, p: "/payments", sum: "Take a payment (card on file, terminal, cash, check) and post to the ledger", body: PaymentCreateRequest, res: "created:Payment", roles: [frontdesk, biller, manager], screens: [billing.payment-capture, home.frontdesk-board, schedule.checkout, billing.patient-account, chart.account], integ: PaymentGateway, audit: CREATE, inv: [INV-FIN-01]}
  - {id: refundPayment, m: POST, p: "/payments/{paymentId}/refund", sum: "Refund (reversing ledger entry)", body: RefundRequest, res: Payment, roles: [biller, manager], stepup: true, screens: [billing.payment-capture, billing.patient-account], integ: PaymentGateway, audit: UPDATE, inv: [INV-FIN-01]}
  - {id: getPaymentReceipt, m: GET, p: "/payments/{paymentId}/receipt", sum: "Receipt PDF", res: file, roles: [frontdesk, biller, manager], screens: [billing.payment-capture], audit: PRINT}
  - {id: sendPaymentReceipt, m: POST, p: "/payments/{paymentId}/receipt/send", sum: "Text or email a receipt", body: ChannelRequest, res: accepted, roles: [frontdesk, biller, manager], screens: [billing.payment-capture, home.frontdesk-board], integ: MessagingGateway}
  - {id: listPaymentMethods, m: GET, p: "/patients/{patientId}/payment-methods", sum: "Cards on file (brand, last4, expiry only)", res: "list:PaymentMethod", roles: [frontdesk, biller, manager], screens: [billing.payment-capture, billing.patient-account, home.frontdesk-board]}
  - {id: createPaymentMethod, m: POST, p: "/patients/{patientId}/payment-methods", sum: "Save a card token from the processor's hosted fields (with consent)", body: PaymentMethodCreateRequest, res: "created:PaymentMethod", roles: [frontdesk, biller, manager], screens: [billing.payment-capture], integ: PaymentGateway, audit: CREATE}
  - {id: deletePaymentMethod, m: DELETE, p: "/payment-methods/{paymentMethodId}", sum: "Remove a card on file", res: none, roles: [frontdesk, biller, manager], screens: [billing.patient-account], integ: PaymentGateway, audit: UPDATE}

  - {id: listHeldCharges, m: GET, p: "/charge-review", sum: "Encounters with held charges grouped by edit rule", q: [rule, payerId, practitionerId], res: "page:ChargeReviewRow", screens: [billing.charge-review, home.rcm-queues, reports.charge-lag], flows: ["flow:rcm/02"]}
  - {id: getChargeReviewItem, m: GET, p: "/charge-review/{encounterId}", sum: "Charge lines, edits, diagnoses and payer rules (no note text)", res: ChargeReviewDetail, screens: [billing.charge-review], inv: [INV-SEC-05]}
  - {id: releaseEncounterCharges, m: POST, p: "/charge-review/{encounterId}/release", sum: "Re-run edits and release clean charges to a claim", res: ChargeReviewDetail, screens: [billing.charge-review], flows: ["flow:rcm/02"], tr: ["claim:new->draft", "claim:draft->ready"], audit: UPDATE, inv: [INV-FIN-03]}
  - {id: holdEncounterCharges, m: POST, p: "/charge-review/{encounterId}/hold", sum: "Hold with reason", body: ReasonRequest, res: ChargeReviewDetail, screens: [billing.charge-review], audit: UPDATE}
  - {id: queryProvider, m: POST, p: "/charge-review/{encounterId}/provider-query", sum: "Ask the provider a coding question (task with return link)", body: CommentRequest, res: TaskView, screens: [billing.charge-review], audit: CREATE}
  - {id: releaseFixedCharges, m: POST, p: "/charge-review/release-fixed", sum: "Release every encounter whose edits are now clean", res: BulkResult, screens: [billing.charge-review], tr: ["claim:new->draft", "claim:draft->ready"], audit: UPDATE}

  - {id: getClaimPipeline, m: GET, p: "/claims/pipeline", sum: "Counts and amounts per claim status, clean-claim rate, next batch time", q: [payerId], res: ClaimPipeline, screens: [billing.claims, home.rcm-queues], phi: false}
  - {id: listClaims, m: GET, p: "/claims", sum: "Claims by status, payer and date", q: [status, payerId, fromDate, toDate, patientId], res: "page:ClaimSummary", screens: [billing.claims, billing.patient-account, reports.ar-aging, home.rcm-queues]}
  - {id: getClaim, m: GET, p: "/claims/{claimId}", sum: "Claim lines, history, filing deadline, rejection detail", res: ClaimDetail, screens: [billing.claims, billing.rejections, billing.denials, billing.era-posting, billing.patient-account]}
  - {id: submitClaims, m: POST, p: "/claims/submit", sum: "Submit ready claims now (837P batch via Stedi)", body: ClaimSubmitRequest, res: job, screens: [billing.claims], flows: ["flow:rcm/03"], tr: ["claim:ready->submitted"], integ: ClearinghouseGateway, audit: DISCLOSE, inv: [INV-FIN-03]}
  - {id: getClaimX12, m: GET, p: "/claims/{claimId}/x12", sum: "Generated 837P for troubleshooting", res: file, screens: [billing.claims], audit: READ}
  - {id: updateClaim, m: PATCH, p: "/claims/{claimId}", sum: "Correct claim fields for a rejection (coverage, NPIs, POS, auth number)", body: ClaimCorrection, res: ClaimDetail, screens: [billing.rejections, billing.denials], audit: UPDATE}
  - {id: resubmitClaim, m: POST, p: "/claims/{claimId}/resubmit", sum: "Resubmit a corrected claim (frequency code set automatically)", res: ClaimDetail, screens: [billing.rejections, billing.denials], flows: ["flow:rcm/05"], tr: ["claim:rejected->submitted", "claim:denied->submitted"], integ: ClearinghouseGateway, audit: DISCLOSE}
  - {id: transferClaimToPatient, m: POST, p: "/claims/{claimId}/transfer-to-patient", sum: "Bill the patient instead (transfer responsibility)", body: ReasonRequest, res: ClaimDetail, screens: [billing.rejections], tr: ["claim:rejected->closed"], audit: UPDATE, inv: [INV-FIN-01]}
  - {id: closeClaim, m: POST, p: "/claims/{claimId}/close", sum: "Close when insurance balance is zero or an approved write-off exists", body: ReasonRequest, res: ClaimDetail, screens: [billing.claims, billing.denials], tr: ["claim:paid->closed", "claim:partially-paid->closed", "claim:denied->closed"], audit: UPDATE, inv: [INV-FIN-01]}
  - {id: checkClaimStatus, m: POST, p: "/claims/{claimId}/status-inquiry", sum: "276/277 claim status inquiry", res: ClaimDetail, screens: [billing.claims], integ: ClearinghouseGateway}
  - {id: listRejections, m: GET, p: "/claims/rejections", sum: "Rejected claims with plain-language reason and field to fix", q: [payerId], res: "page:RejectionRow", screens: [billing.rejections, home.rcm-queues], flows: ["flow:rcm/04"], inv: [INV-FIN-05]}

  - {id: listRemittances, m: GET, p: "/remittances", sum: "ERAs received with posting status", q: [status, payerId, fromDate, toDate], res: "page:RemittanceSummary", screens: [billing.era-posting, home.rcm-queues]}
  - {id: getRemittance, m: GET, p: "/remittances/{remittanceId}", sum: "Balance check, provider-level adjustments, claim payment lines with CARC/RARC and underpayment flags", res: RemittanceDetail, screens: [billing.era-posting]}
  - {id: getRemittanceX12, m: GET, p: "/remittances/{remittanceId}/x12", sum: "Raw 835", res: file, screens: [billing.era-posting], audit: READ}
  - {id: matchRemittanceClaimPayment, m: POST, p: "/remittance-claim-payments/{remittanceClaimPaymentId}/match", sum: "Match an unmatched claim payment to a claim", body: ClaimRefRequest, res: RemittanceDetail, screens: [billing.era-posting], audit: UPDATE}
  - {id: postProviderAdjustment, m: POST, p: "/provider-adjustments/{providerLevelAdjustmentId}/post", sum: "Post a recoupment or PLB to its source claim", body: ClaimRefRequest, res: RemittanceDetail, screens: [billing.era-posting], audit: UPDATE, inv: [INV-FIN-01]}
  - {id: postRemittance, m: POST, p: "/remittances/{remittanceId}/post", sum: "Post a balanced ERA; denials and underpayments go to the denials worklist", res: RemittanceDetail, screens: [billing.era-posting], flows: ["flow:rcm/06"], tr: ["claim:accepted->paid", "claim:appealed->paid", "claim:accepted->partially-paid", "claim:accepted->denied", "claim:appealed->denied"], audit: UPDATE, inv: [INV-FIN-01, INV-FIN-05]}

  - {id: getDenialGroups, m: GET, p: "/denials/groups", sum: "Root-cause groups with counts and dollars", res: "list:DenialGroup", screens: [billing.denials], phi: false}
  - {id: listDenials, m: GET, p: "/denials", sum: "Denials and underpayments with appeal deadlines", q: [rootCause, status, payerId, sort], res: "page:DenialRow", screens: [billing.denials, home.rcm-queues], flows: ["flow:rcm/07"], inv: [INV-FIN-05]}
  - {id: getDenial, m: GET, p: "/denials/{denialId}", sum: "Denial with reason, claim and appeal history", res: DenialDetail, screens: [billing.denials]}
  - {id: draftAppealLetter, m: POST, p: "/denials/{denialId}/appeal-letter", sum: "Draft an appeal letter from the payer template", body: AppealLetterRequest, res: AppealDraft, screens: [billing.denials]}
  - {id: submitAppeal, m: POST, p: "/denials/{denialId}/appeals", sum: "Submit an appeal with attachments (full note needs provider release)", body: AppealCreateRequest, res: DenialDetail, screens: [billing.denials], tr: ["claim:denied->appealed", "claim:partially-paid->appealed"], audit: DISCLOSE, inv: [INV-SEC-05]}
  - {id: writeOffDenial, m: POST, p: "/denials/{denialId}/write-off", sum: "Write off (manager approval above threshold)", body: WriteOffRequest, res: DenialDetail, screens: [billing.denials], audit: UPDATE, inv: [INV-FIN-01]}
  - {id: snoozeDenial, m: POST, p: "/denials/{denialId}/snooze", sum: "Snooze until a date (deadline still shown)", body: SnoozeRequest, res: DenialDetail, screens: [billing.denials], audit: UPDATE}

  - {id: getStatementCycle, m: GET, p: "/statements/cycle", sum: "Next statement run, patients included, delivery mix, holds", res: StatementCycle, screens: [billing.statements]}
  - {id: runStatements, m: POST, p: "/statements/runs", sum: "Generate and send statements now", res: job, screens: [billing.statements], integ: MessagingGateway, audit: DISCLOSE}
  - {id: listStatements, m: GET, p: "/statements", sum: "Statements sent", q: [patientId, fromDate, toDate], res: "page:Statement", screens: [billing.statements, billing.patient-account]}
  - {id: getStatementPdf, m: GET, p: "/statements/{statementId}/pdf", sum: "Statement PDF", res: file, screens: [billing.statements, billing.patient-account], audit: PRINT}
  - {id: sendStatementNow, m: POST, p: "/patients/{patientId}/statements", sum: "Send this patient a statement now", body: ChannelRequest, res: Statement, screens: [billing.patient-account], integ: MessagingGateway, audit: DISCLOSE}

  - {id: getPatientAccount, m: GET, p: "/patients/{patientId}/account", sum: "Account by visit: charges, insurance paid, adjustments, patient responsibility, payments, plan and statement status", res: PatientAccount, roles: [frontdesk, biller, manager], screens: [billing.patient-account, chart.account], inv: [INV-FIN-02]}
  - {id: listLedgerEntries, m: GET, p: "/patients/{patientId}/ledger", sum: "Raw ledger (append-only)", q: [fromDate, toDate], res: "page:LedgerEntry", screens: [billing.patient-account], inv: [INV-FIN-01]}
  - {id: listPaymentPlans, m: GET, p: "/patients/{patientId}/payment-plans", sum: "Payment plans", res: "list:PaymentPlan", roles: [frontdesk, biller, manager], screens: [billing.patient-account]}
  - {id: createPaymentPlan, m: POST, p: "/patients/{patientId}/payment-plans", sum: "Create an autopay plan; pauses statements; texts the patient", body: PaymentPlanRequest, res: "created:PaymentPlan", roles: [frontdesk, biller, manager], screens: [billing.patient-account], integ: PaymentGateway, audit: CREATE}
  - {id: cancelPaymentPlan, m: POST, p: "/payment-plans/{paymentPlanId}/cancel", sum: "Cancel a plan", body: ReasonRequest, res: PaymentPlan, screens: [billing.patient-account], audit: UPDATE}

  - {id: getDayClose, m: GET, p: "/deposit-batches/current", sum: "Today's batch: payments by user and method, deposit and bank match", q: [locationId, date], res: DepositBatchView, roles: [frontdesk, biller, manager], screens: [billing.day-close], flows: ["flow:rcm/09"], phi: false}
  - {id: saveDrawerCounts, m: PUT, p: "/deposit-batches/{depositBatchId}/counts", sum: "Enter counted amounts", body: DrawerCounts, res: DepositBatchView, roles: [frontdesk, biller, manager], screens: [billing.day-close], phi: false, audit: UPDATE}
  - {id: closeDepositBatch, m: POST, p: "/deposit-batches/{depositBatchId}/close", sum: "Close the day (variance needs a reason)", body: DayCloseRequest, res: DepositBatchView, screens: [billing.day-close], phi: false, audit: UPDATE, inv: [INV-FIN-04]}
