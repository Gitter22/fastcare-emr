tag: Inbox
description: Tasks (states.yaml#task), co-sign queue and patient messaging. Message notifications by SMS/email never include clinical detail (INV-SEC-06).
defaults: {auth: staff, roles: [frontdesk, ma, provider, biller, manager], audit: READ}
ops:
  - {id: listTasks, m: GET, p: "/tasks", sum: "Tasks for me, my pools or created by me", q: [assignee, poolId, status, type, patientId], res: "page:TaskView", screens: [inbox.tasks, home.rcm-queues, home.practice-kpis]}
  - {id: createTask, m: POST, p: "/tasks", sum: "Create a task (forward, provider query, follow-up)", body: "create:Task", res: "created:TaskView", screens: [inbox.tasks, global.command-bar, inbox.results, inbox.prior-auth, billing.charge-review, chart.communications], tr: ["task:new->open"], audit: CREATE}
  - {id: getTask, m: GET, p: "/tasks/{taskId}", sum: "Task with linked item and comments", res: TaskView, screens: [inbox.tasks]}
  - {id: updateTask, m: PATCH, p: "/tasks/{taskId}", sum: "Reassign, change due date or priority", body: "update:Task", res: TaskView, screens: [inbox.tasks, inbox.patient-messages], audit: UPDATE}
  - {id: startTask, m: POST, p: "/tasks/{taskId}/start", sum: "Start working a task", body: TransitionRequest, res: TaskView, screens: [inbox.tasks], tr: ["task:open->in-progress", "task:escalated->in-progress"], audit: UPDATE}
  - {id: pendTaskToProvider, m: POST, p: "/tasks/{taskId}/pend", sum: "Pend to provider", body: CommentRequest, res: TaskView, roles: [frontdesk, ma], screens: [inbox.tasks, inbox.patient-messages], tr: ["task:open->pended-to-provider", "task:in-progress->pended-to-provider"], audit: UPDATE}
  - {id: completeTask, m: POST, p: "/tasks/{taskId}/complete", sum: "Complete a task (critical-result tasks need documented contact)", body: CommentRequest, res: TaskView, screens: [inbox.tasks], tr: ["task:open->completed", "task:in-progress->completed", "task:pended-to-provider->completed", "task:escalated->completed"], audit: UPDATE, inv: [INV-SAFE-04]}
  - {id: escalateTask, m: POST, p: "/tasks/{taskId}/escalate", sum: "Escalate now (also automatic past due)", body: CommentRequest, res: TaskView, screens: [inbox.tasks, inbox.patient-messages], tr: ["task:open->escalated", "task:in-progress->escalated", "task:pended-to-provider->escalated"], audit: UPDATE}
  - {id: addTaskComment, m: POST, p: "/tasks/{taskId}/comments", sum: "Comment on a task", body: CommentRequest, res: TaskComment, screens: [inbox.tasks], audit: CREATE}
  - {id: listCosignQueue, m: GET, p: "/inbox/cosign", sum: "Notes and orders awaiting my co-signature", res: "page:CosignItem", roles: [provider], screens: [inbox.cosign, home.provider-worklist]}

  - {id: listMessageThreads, m: GET, p: "/message-threads", sum: "Patient message threads by pool with SLA, urgency and proxy flags", q: [scope, poolId, patientId, category, status], res: "page:ThreadSummary", screens: [inbox.patient-messages, chart.communications, home.provider-worklist, home.clinical-daylist], flows: ["flow:refills/02"]}
  - {id: createMessageThread, m: POST, p: "/message-threads", sum: "Staff starts a message to a patient (result notification, reminder)", body: StaffNewThread, res: "created:ThreadDetail", roles: [frontdesk, ma, provider, manager], screens: [inbox.patient-messages, chart.summary, chart.results, chart.communications, inbox.results, orders.tracking, referrals.worklist, patients.lists], integ: MessagingGateway, audit: DISCLOSE, inv: [INV-SEC-06]}
  - {id: getMessageThread, m: GET, p: "/message-threads/{threadId}", sum: "Thread with messages and internal notes", res: ThreadDetail, screens: [inbox.patient-messages, chart.communications]}
  - {id: postStaffMessage, m: POST, p: "/message-threads/{threadId}/messages", sum: "Reply to the patient or add an internal note; replying completes the task", body: StaffMessageCreate, res: Message, roles: [frontdesk, ma, provider, manager], screens: [inbox.patient-messages], flows: ["flow:refills/05"], tr: ["task:in-progress->completed", "task:open->completed"], integ: MessagingGateway, audit: DISCLOSE, inv: [INV-SEC-06]}
  - {id: assignMessageThread, m: POST, p: "/message-threads/{threadId}/assign", sum: "Assign to a user or pool", body: AssignRequest, res: ThreadSummary, screens: [inbox.patient-messages], audit: UPDATE}
  - {id: convertThreadToEVisit, m: POST, p: "/message-threads/{threadId}/convert-to-evisit", sum: "Convert a message into a billable e-visit", res: EVisitView, roles: [provider], screens: [inbox.patient-messages], audit: CREATE}
  - {id: closeMessageThread, m: POST, p: "/message-threads/{threadId}/close", sum: "Close a thread", res: none, screens: [inbox.patient-messages], audit: UPDATE}
  - {id: listMessageTemplates, m: GET, p: "/message-templates", sum: "Reply and notification templates", res: "list:MessageTemplate", screens: [inbox.patient-messages, inbox.results], phi: false}

  - {id: listCommunications, m: GET, p: "/patients/{patientId}/communications", sum: "Calls, letters, SMS/email log and portal threads for a patient", q: [type], res: "page:CommunicationLog", screens: [chart.communications]}
  - {id: logPhoneCall, m: POST, p: "/patients/{patientId}/phone-calls", sum: "Log a phone call (optionally create a follow-up task)", body: PhoneCallCreate, res: CommunicationLog, roles: [frontdesk, ma, provider], screens: [chart.communications, inbox.patient-messages], audit: CREATE}
  - {id: generateLetter, m: POST, p: "/patients/{patientId}/letters", sum: "Generate a letter from a template", body: LetterRequest, res: file, roles: [frontdesk, ma, provider], screens: [chart.communications], audit: PRINT}
