tag: Patients
description: Patient identity, demographics, coverage, consents, portal access, duplicates and privacy controls. Every read is audited; restricted records require consent or emergency access (INV-SEC-03).
defaults: {auth: staff, roles: [frontdesk, ma, provider, biller, manager], audit: READ}
ops:
  - {id: searchPatients, m: GET, p: "/patients", sum: "Search by name, DOB, phone or MRN (fuzzy); DOB returned on every row", q: [q, birthDate, phone, mrn], res: "page:PatientSummary", screens: [patients.search, schedule.booking-drawer, billing.payment-capture, inbox.patient-messages, inbox.documents, inbox.tasks, schedule.waitlist], audit: QUERY, inv: [INV-ID-01]}
  - {id: checkDuplicates, m: POST, p: "/patients/duplicate-check", sum: "Possible existing patients for entered identity; returns a check token required by createPatient", body: PatientMatchInput, res: DuplicateCheckResult, roles: [frontdesk, manager], screens: [patients.registration, schedule.booking-drawer], audit: QUERY, inv: [INV-ID-02]}
  - {id: createPatient, m: POST, p: "/patients", sum: "Register a patient (requires a duplicate-check token; 'not the same person' is logged)", body: PatientCreateRequest, res: "created:PatientDetail", roles: [frontdesk, manager], screens: [patients.registration], flows: ["flow:access/02"], audit: CREATE, inv: [INV-ID-02]}
  - {id: getPatient, m: GET, p: "/patients/{patientId}", sum: "Patient detail: demographics, addresses, contact points, related persons, guarantor", res: PatientDetail, screens: [chart.demographics, patients.registration], inv: [INV-SEC-03]}
  - {id: updatePatient, m: PATCH, p: "/patients/{patientId}", sum: "Update demographics", body: "update:Patient", res: PatientDetail, roles: [frontdesk, ma, provider, manager], screens: [chart.demographics, patients.registration], audit: UPDATE}
  - {id: replacePatientAddresses, m: PUT, p: "/patients/{patientId}/addresses", sum: "Replace addresses", body: "list:PatientAddressCreate", res: "list:PatientAddress", roles: [frontdesk, manager], screens: [chart.demographics, patients.registration], audit: UPDATE}
  - {id: replacePatientContactPoints, m: PUT, p: "/patients/{patientId}/contact-points", sum: "Replace phones and emails (keeps SMS opt-out)", body: "list:PatientContactPointCreate", res: "list:PatientContactPoint", roles: [frontdesk, manager], screens: [chart.demographics, patients.registration], audit: UPDATE}
  - {id: listRelatedPersons, m: GET, p: "/patients/{patientId}/related-persons", sum: "Guarantor, emergency contacts, guardians", res: "list:RelatedPerson", screens: [chart.demographics, patients.registration]}
  - {id: createRelatedPerson, m: POST, p: "/patients/{patientId}/related-persons", sum: "Add guarantor, guardian or contact", body: "create:RelatedPerson", res: "created:RelatedPerson", roles: [frontdesk, manager], screens: [patients.registration, chart.demographics], audit: CREATE}
  - {id: updateRelatedPerson, m: PATCH, p: "/related-persons/{relatedPersonId}", sum: "Update a related person", body: "update:RelatedPerson", res: RelatedPerson, roles: [frontdesk, manager], screens: [chart.demographics], audit: UPDATE}
  - {id: getPatientBanner, m: GET, p: "/patients/{patientId}/banner", sum: "Identity banner: name, DOB, MRN, photo, PCP, coverage status, balance, allergies, code status, language, restriction flag", res: PatientBanner, screens: [chart.summary, chart.timeline, chart.problems, chart.medications, chart.allergies, chart.vitals, chart.results, chart.immunizations, chart.history, chart.orders, chart.referrals, chart.care-plan, chart.care-gaps, chart.documents, chart.communications, chart.demographics, chart.consents, chart.account, chart.access-log, encounter.prechart, encounter.rooming, encounter.note, encounter.orders, encounter.rx, encounter.dx-coding, encounter.charges, encounter.avs, encounter.sign, schedule.checkout, telehealth.visit], inv: [INV-ID-01, INV-FIN-02]}
  - {id: getPatientSummary, m: GET, p: "/patients/{patientId}/summary", sum: "Chart summary cards (problems, meds, results, vitals, gaps, visits) with restricted-record count", res: ChartSummary, roles: [frontdesk, ma, provider], screens: [chart.summary], inv: [INV-SEC-03]}
  - {id: getPatientTimeline, m: GET, p: "/patients/{patientId}/timeline", sum: "Visits, results, documents and messages by date", q: [types, fromDate, toDate], res: "page:TimelineItem", roles: [ma, provider], screens: [chart.timeline]}
  - {id: requestEmergencyAccess, m: POST, p: "/patients/{patientId}/emergency-access", sum: "Break the glass: time-limited access to restricted records with a reason; alerts the privacy officer", body: EmergencyAccessRequest, res: EmergencyAccessGrant, roles: [ma, provider], screens: [chart.consents, chart.summary], audit: BREAK_GLASS, inv: [INV-SEC-03, INV-SEC-01]}
  - {id: listPatientAccessLog, m: GET, p: "/patients/{patientId}/access-log", sum: "Who viewed or changed this record", q: [fromDate, toDate, action], res: "page:AuditEventEntry", roles: [manager], screens: [chart.access-log], inv: [INV-SEC-01]}
  - {id: listDisclosures, m: GET, p: "/patients/{patientId}/disclosures", sum: "Accounting of disclosures (HIPAA §164.528)", res: "page:DisclosureLog", roles: [manager], screens: [chart.access-log]}
  - {id: recordDisclosure, m: POST, p: "/patients/{patientId}/disclosures", sum: "Record a disclosure outside treatment, payment and operations", body: "create:DisclosureLog", res: "created:DisclosureLog", roles: [frontdesk, manager], screens: [chart.access-log, chart.documents], audit: DISCLOSE}
  - {id: createAmendmentRequest, m: POST, p: "/patients/{patientId}/amendment-requests", sum: "Log a patient request to amend the record (HIPAA §164.526)", body: "create:AmendmentRequest", res: "created:AmendmentRequest", roles: [frontdesk, manager], screens: [chart.consents], audit: CREATE}
  - {id: listAmendmentRequests, m: GET, p: "/amendment-requests", sum: "Open amendment requests with 60-day due dates", q: [status], res: "page:AmendmentRequest", roles: [manager], screens: [chart.consents, admin.audit-log]}
  - {id: decideAmendmentRequest, m: POST, p: "/amendment-requests/{amendmentRequestId}/decision", sum: "Accept or deny an amendment with written response", body: AmendmentDecision, res: AmendmentRequest, roles: [manager, provider], screens: [chart.consents], audit: UPDATE}

  # Coverage & eligibility
  - {id: listCoverages, m: GET, p: "/patients/{patientId}/coverages", sum: "Coverages in order with latest eligibility", res: "list:CoverageView", screens: [chart.demographics, home.frontdesk-board, billing.eligibility, billing.rejections]}
  - {id: createCoverage, m: POST, p: "/patients/{patientId}/coverages", sum: "Add insurance", body: "create:Coverage", res: "created:Coverage", roles: [frontdesk, biller, manager], screens: [patients.registration, chart.demographics], audit: CREATE}
  - {id: updateCoverage, m: PATCH, p: "/coverages/{coverageId}", sum: "Update insurance (order, member id, end date)", body: "update:Coverage", res: Coverage, roles: [frontdesk, biller, manager], screens: [chart.demographics, billing.rejections], audit: UPDATE}
  - {id: scanInsuranceCard, m: POST, p: "/coverages/card-scan", sum: "OCR an insurance card image into payer, member id and group (stores images)", body: multipart, res: CardScanResult, roles: [frontdesk, biller, manager], screens: [patients.registration, chart.demographics, home.frontdesk-board], audit: CREATE}
  - {id: checkEligibility, m: POST, p: "/coverages/{coverageId}/eligibility-checks", sum: "Real-time 270/271 eligibility check", body: EligibilityCheckRequest, res: EligibilityCheck, roles: [frontdesk, biller, manager], screens: [home.frontdesk-board, schedule.booking-drawer, schedule.appointment-detail, chart.demographics, billing.eligibility, billing.rejections, patients.registration], flows: ["flow:access/03"], integ: ClearinghouseGateway, audit: QUERY, inv: [INV-OPS-01]}
  - {id: listEligibilityChecks, m: GET, p: "/coverages/{coverageId}/eligibility-checks", sum: "Eligibility history", res: "page:EligibilityCheck", screens: [billing.eligibility, chart.demographics]}
  - {id: getEligibilityCheck, m: GET, p: "/eligibility-checks/{eligibilityCheckId}", sum: "Parsed 271 benefits and raw response", res: EligibilityCheckDetail, screens: [billing.eligibility]}

  # Consents & portal access
  - {id: listConsents, m: GET, p: "/patients/{patientId}/consents", sum: "Consents, restrictions and communication preferences", res: "list:Consent", screens: [chart.consents, home.frontdesk-board, telehealth.waiting-room, chart.care-plan]}
  - {id: createConsent, m: POST, p: "/patients/{patientId}/consents", sum: "Record a signed consent (tablet, verbal, paper upload)", body: "create:Consent", res: "created:Consent", roles: [frontdesk, ma, provider, manager], screens: [chart.consents, home.frontdesk-board, patients.registration, chart.care-plan], audit: CREATE}
  - {id: revokeConsent, m: POST, p: "/consents/{consentId}/revoke", sum: "Revoke a consent", body: ReasonRequest, res: Consent, roles: [frontdesk, manager], screens: [chart.consents], audit: UPDATE}
  - {id: requestConsentSignature, m: POST, p: "/patients/{patientId}/consent-requests", sum: "Send consent forms to the portal or signature tablet", body: ConsentSignatureRequest, res: accepted, roles: [frontdesk, ma, manager], screens: [home.frontdesk-board, chart.consents], integ: MessagingGateway}
  - {id: listPortalAccess, m: GET, p: "/patients/{patientId}/portal-access", sum: "Portal account status and proxies", res: "list:PortalAccessView", screens: [chart.consents, chart.demographics]}
  - {id: invitePortalUser, m: POST, p: "/patients/{patientId}/portal-invitations", sum: "Invite the patient or a proxy to the portal", body: PortalInvitationRequest, res: accepted, roles: [frontdesk, manager], screens: [patients.registration, chart.consents], integ: MessagingGateway, audit: CREATE}
  - {id: revokePortalAccess, m: POST, p: "/portal-access/{portalAccessId}/revoke", sum: "Revoke a proxy or portal access", body: ReasonRequest, res: none, roles: [frontdesk, manager], screens: [chart.consents], audit: PERMISSION_CHANGE}

  # Duplicates & merge
  - {id: listDuplicateCandidates, m: GET, p: "/duplicate-candidates", sum: "Possible duplicate pairs", q: [status], res: "page:DuplicateCandidateView", roles: [manager], screens: [patients.merge-review, home.practice-kpis]}
  - {id: getDuplicateComparison, m: GET, p: "/duplicate-candidates/{duplicateCandidateId}", sum: "Field-by-field comparison with record counts", res: DuplicateComparison, roles: [manager], screens: [patients.merge-review]}
  - {id: mergePatients, m: POST, p: "/duplicate-candidates/{duplicateCandidateId}/merge", sum: "Reversible merge into the chosen survivor", body: MergeRequest, res: PatientMerge, roles: [manager], stepup: true, screens: [patients.merge-review], audit: MERGE, inv: [INV-ID-04, INV-SEC-01]}
  - {id: dismissDuplicate, m: POST, p: "/duplicate-candidates/{duplicateCandidateId}/dismiss", sum: "Not duplicates", res: none, roles: [manager], screens: [patients.merge-review], audit: UPDATE}
  - {id: unmergePatients, m: POST, p: "/patient-merges/{patientMergeId}/unmerge", sum: "Undo a merge", res: PatientMerge, roles: [manager], stepup: true, screens: [patients.merge-review], audit: MERGE, inv: [INV-ID-04]}

  # Lists & registries
  - {id: listPatientLists, m: GET, p: "/patient-lists", sum: "My and shared patient lists", res: "list:PatientList", roles: [ma, provider, manager], screens: [patients.lists], phi: false}
  - {id: createPatientList, m: POST, p: "/patient-lists", sum: "Save a list definition", body: "create:PatientList", res: "created:PatientList", roles: [ma, provider, manager], screens: [patients.lists], phi: false}
  - {id: updatePatientList, m: PATCH, p: "/patient-lists/{patientListId}", sum: "Edit a list", body: "update:PatientList", res: PatientList, roles: [ma, provider, manager], screens: [patients.lists], phi: false}
  - {id: getPatientListMembers, m: GET, p: "/patient-lists/{patientListId}/patients", sum: "Patients matching a saved list", res: "page:PatientSummary", roles: [ma, provider, manager], screens: [patients.lists]}
  - {id: getRegistryMembers, m: GET, p: "/registries/{registryKey}/patients", sum: "Registry members with key values and open gaps", q: [practitionerId], res: "page:RegistryRow", roles: [ma, provider, manager], screens: [patients.registries], flows: ["flow:quality/01"]}

  # Pre-visit / patient-entered changes
  - {id: listStagedChanges, m: GET, p: "/staged-changes", sum: "Patient-entered and outside changes awaiting review, grouped by patient and visit", q: [status, date], res: "page:StagedChangeView", roles: [frontdesk, ma, manager], screens: [inbox.previsit-queue, home.frontdesk-board], flows: ["flow:access/06"]}
  - {id: decideStagedChange, m: POST, p: "/staged-changes/{stagedChangeId}/decision", sum: "Accept or reject each proposed field; insurance changes trigger eligibility", body: StagedChangeDecision, res: StagedChange, roles: [frontdesk, ma, manager], screens: [inbox.previsit-queue], audit: UPDATE, inv: [INV-DATA-01]}
