tag: Orders
description: Orders (states.yaml#order), specimen collection, results review, unmatched results, overdue tracking, referrals (states.yaml#referral) and prior authorizations. Orders go out through LabGateway (Health Gorilla or direct Quest/LabCorp).
defaults: {auth: staff, roles: [ma, provider], audit: READ}
ops:
  - {id: searchOrderCatalog, m: GET, p: "/order-catalog", sum: "Lab compendium, imaging, procedures and referral specialties; includes AOE questions", q: [q, category, lab], res: "list:OrderCatalogItem", screens: [encounter.orders], phi: false}
  - {id: listEncounterOrders, m: GET, p: "/encounters/{encounterId}/service-requests", sum: "Orders on this encounter with validation state", res: "list:ServiceRequestView", screens: [encounter.orders, encounter.rooming, schedule.checkout, encounter.sign]}
  - {id: createServiceRequest, m: POST, p: "/encounters/{encounterId}/service-requests", sum: "Add an order (pended) linked to diagnoses", body: ServiceRequestCreate, res: "created:ServiceRequestView", screens: [encounter.orders, encounter.note, encounter.rooming, encounter.prechart, chart.care-gaps, telehealth.evisit], flows: ["flow:encounter/04"], tr: ["order:new->pended"], audit: CREATE}
  - {id: applyOrderSet, m: POST, p: "/encounters/{encounterId}/order-sets/{orderSetId}/apply", sum: "Add every item of an order set as pended orders", res: "list:ServiceRequestView", roles: [provider], screens: [encounter.orders], tr: ["order:new->pended"], audit: CREATE}
  - {id: updateServiceRequest, m: PATCH, p: "/service-requests/{serviceRequestId}", sum: "Edit a pended order (diagnoses, AOE, priority, collection, expected-by)", body: ServiceRequestUpdate, res: ServiceRequestView, screens: [encounter.orders], audit: UPDATE, inv: [INV-SAFE-07, INV-SAFE-08]}
  - {id: validateEncounterOrders, m: GET, p: "/encounters/{encounterId}/service-requests/validation", sum: "Missing diagnoses, unanswered AOE, duplicates, ABN needs", res: OrderValidation, screens: [encounter.orders, encounter.sign], inv: [INV-SAFE-08]}
  - {id: signOrders, m: POST, p: "/encounters/{encounterId}/service-requests/sign", sum: "Sign pended orders (patient context must match); transmits to labs, routes referrals", body: SignOrdersRequest, res: "list:ServiceRequestView", roles: [provider], screens: [encounter.orders], flows: ["flow:encounter/04", "flow:results/01"], tr: ["order:new->signed", "order:pended->signed"], integ: LabGateway, audit: SIGN, inv: [INV-SAFE-01, INV-ID-03, INV-SAFE-08]}
  - {id: sendServiceRequest, m: POST, p: "/service-requests/{serviceRequestId}/send", sum: "Transmit or retransmit a signed order (worker or manual retry)", res: ServiceRequestView, roles: [ma, provider, manager], screens: [admin.interfaces, chart.orders], tr: ["order:signed->sent"], integ: LabGateway, audit: UPDATE, inv: [INV-OPS-01]}
  - {id: getRequisition, m: GET, p: "/service-requests/{serviceRequestId}/requisition", sum: "Requisition PDF (downtime or paper fallback)", res: file, screens: [chart.orders, orders.collection], audit: PRINT}
  - {id: getSpecimenLabels, m: GET, p: "/service-requests/{serviceRequestId}/labels", sum: "Specimen labels", res: file, screens: [orders.collection], audit: PRINT}
  - {id: listPatientServiceRequests, m: GET, p: "/patients/{patientId}/service-requests", sum: "All orders for a patient with status and expected-by", q: [status, category], res: "page:ServiceRequestView", screens: [chart.orders, chart.summary, inbox.results]}
  - {id: cancelServiceRequest, m: POST, p: "/service-requests/{serviceRequestId}/cancel", sum: "Cancel an order with reason (sends cancel to lab if transmitted)", body: ReasonRequest, res: ServiceRequestView, screens: [encounter.orders, chart.orders, orders.tracking], tr: ["order:pended->cancelled", "order:signed->cancelled", "order:sent->cancelled"], integ: LabGateway, audit: UPDATE}
  - {id: extendExpectedDate, m: POST, p: "/service-requests/{serviceRequestId}/expected-date", sum: "Extend the expected result date", body: ExpectedDateRequest, res: ServiceRequestView, screens: [orders.tracking], audit: UPDATE, inv: [INV-SAFE-07]}
  - {id: recordKitHandoff, m: POST, p: "/service-requests/{serviceRequestId}/kit-handoff", sum: "Record home-kit handed over or mailed (e.g. FIT)", body: KitHandoffRequest, res: ServiceRequestView, roles: [frontdesk, ma], screens: [schedule.checkout], audit: UPDATE}

  - {id: listCollectionQueue, m: GET, p: "/specimen-collection", sum: "Signed orders needing a specimen today", q: [date, locationId], res: "page:CollectionItem", roles: [ma], screens: [orders.collection, home.clinical-daylist], flows: ["flow:results/02"]}
  - {id: recordSpecimenCollection, m: POST, p: "/service-requests/{serviceRequestId}/specimens", sum: "Record collection (identity confirmed)", body: SpecimenCollectionRequest, res: ServiceRequestView, roles: [ma], screens: [orders.collection], tr: ["order:sent->collected"], audit: UPDATE, inv: [INV-ID-01]}

  - {id: listOverdueOrders, m: GET, p: "/service-requests/overdue", sum: "Orders past expected date without result and referrals without consult", q: [poolId, practitionerId], res: "page:OverdueOrderRow", screens: [orders.tracking], flows: ["flow:results/06"], inv: [INV-SAFE-07]}
  - {id: checkOrderStatusWithLab, m: POST, p: "/service-requests/{serviceRequestId}/status-check", sum: "Ask the lab for order status", res: ServiceRequestView, screens: [orders.tracking], integ: LabGateway}

  # Results review
  - {id: listResultsToReview, m: GET, p: "/inbox/results", sum: "Results to review, critical first, with escalation times", q: [poolId, assignee], res: "page:ResultInboxItem", roles: [ma, provider], screens: [inbox.results, home.provider-worklist], flows: ["flow:results/04"], inv: [INV-SAFE-04]}
  - {id: reviewResult, m: POST, p: "/diagnostic-reports/{diagnosticReportId}/review", sum: "Sign the result with comment and next action; critical results need documented contact first", body: ReviewResultRequest, res: DiagnosticReportDetail, roles: [provider], screens: [inbox.results], flows: ["flow:results/04"], tr: ["order:resulted-final->reviewed"], audit: SIGN, inv: [INV-SAFE-04, INV-SAFE-01, INV-ID-03]}
  - {id: reviewResultsBulk, m: POST, p: "/diagnostic-reports/review-bulk", sum: "Sign several normal results at once (rejects abnormal/critical)", body: BulkReviewRequest, res: BulkResult, roles: [provider], screens: [inbox.results], tr: ["order:resulted-final->reviewed"], audit: SIGN, inv: [INV-SAFE-01]}
  - {id: recordCriticalContact, m: POST, p: "/diagnostic-reports/{diagnosticReportId}/critical-contacts", sum: "Document patient contact (or failed attempt) for a critical value", body: "create:CriticalResultContact", res: "created:CriticalResultContact", roles: [ma, provider], screens: [inbox.results], audit: CREATE, inv: [INV-SAFE-04]}

  # Unmatched results
  - {id: listInboundResults, m: GET, p: "/inbound-results", sum: "Results that could not be matched to one patient and order", q: [matchStatus], res: "page:InboundResult", roles: [ma, manager], screens: [orders.result-reconciliation, admin.interfaces], inv: [INV-SAFE-03]}
  - {id: getInboundResult, m: GET, p: "/inbound-results/{inboundResultId}", sum: "Message demographics vs candidate patients and orders", res: InboundResultDetail, roles: [ma, manager], screens: [orders.result-reconciliation]}
  - {id: matchInboundResult, m: POST, p: "/inbound-results/{inboundResultId}/match", sum: "File the result to the chosen patient and order; notifies orderer", body: MatchResultRequest, res: DiagnosticReportDetail, roles: [ma, manager], screens: [orders.result-reconciliation], tr: ["order:sent->resulted-final", "order:collected->resulted-final", "order:sent->resulted-prelim", "order:collected->resulted-prelim"], audit: UPDATE, inv: [INV-SAFE-03, INV-SEC-01]}
  - {id: rejectInboundResult, m: POST, p: "/inbound-results/{inboundResultId}/reject", sum: "Not our patient; notify the lab", body: ReasonRequest, res: InboundResult, roles: [ma, manager], screens: [orders.result-reconciliation], integ: LabGateway, audit: UPDATE}

  # Referrals
  - {id: listReferrals, m: GET, p: "/referrals", sum: "Referral worklist", q: [status, direction], res: "page:ReferralView", roles: [frontdesk, ma, provider, manager], screens: [referrals.worklist, orders.tracking]}
  - {id: listPatientReferrals, m: GET, p: "/patients/{patientId}/referrals", sum: "Referrals for a patient", q: [direction], res: "list:ReferralView", roles: [frontdesk, ma, provider], screens: [chart.referrals]}
  - {id: createReferral, m: POST, p: "/encounters/{encounterId}/referrals", sum: "Order a referral (specialty, recipient, urgency, reason, diagnosis)", body: ReferralCreate, res: "created:ReferralView", roles: [provider], screens: [encounter.orders, chart.referrals, chart.summary], flows: ["flow:referral/01"], tr: ["referral:new->ordered"], audit: CREATE}
  - {id: getReferral, m: GET, p: "/referrals/{referralId}", sum: "Referral with payer requirement, authorization and history", res: ReferralView, roles: [frontdesk, ma, provider, manager], screens: [referrals.worklist]}
  - {id: requestReferralAuthorization, m: POST, p: "/referrals/{referralId}/request-auth", sum: "Start a prior authorization for the referral", res: ReferralView, roles: [frontdesk, manager], screens: [referrals.worklist], tr: ["referral:ordered->auth-pending"], audit: UPDATE}
  - {id: sendReferral, m: POST, p: "/referrals/{referralId}/send", sum: "Send with clinical summary (Direct C-CDA or fax)", body: SendReferralRequest, res: ReferralView, roles: [frontdesk, manager], screens: [referrals.worklist, schedule.checkout], flows: ["flow:referral/02"], tr: ["referral:ordered->sent", "referral:auth-pending->sent"], integ: DirectGateway, audit: DISCLOSE}
  - {id: recordSpecialistAppointment, m: POST, p: "/referrals/{referralId}/appointment", sum: "Record the specialist appointment date", body: SpecialistAppointmentRequest, res: ReferralView, roles: [frontdesk, manager], screens: [referrals.worklist], flows: ["flow:referral/03"], tr: ["referral:sent->scheduled"], audit: UPDATE}
  - {id: attachConsultNote, m: POST, p: "/referrals/{referralId}/consult", sum: "Attach the received consult note", body: AttachDocumentRequest, res: ReferralView, roles: [frontdesk, ma, manager], screens: [referrals.worklist, inbox.documents], flows: ["flow:referral/04"], tr: ["referral:sent->consult-received", "referral:scheduled->consult-received"], audit: UPDATE}
  - {id: closeReferral, m: POST, p: "/referrals/{referralId}/close", sum: "Provider closes the loop after reviewing the consult", res: ReferralView, roles: [provider], screens: [chart.referrals, inbox.results], tr: ["referral:consult-received->closed"], audit: UPDATE}
  - {id: cancelReferral, m: POST, p: "/referrals/{referralId}/cancel", sum: "Cancel a referral", body: ReasonRequest, res: ReferralView, roles: [frontdesk, provider, manager], screens: [referrals.worklist], tr: ["referral:ordered->cancelled", "referral:auth-pending->cancelled", "referral:sent->cancelled", "referral:scheduled->cancelled"], audit: UPDATE}

  # Prior authorization
  - {id: listAuthorizations, m: GET, p: "/authorizations", sum: "Prior-authorization tasks", q: [status, patientId], res: "page:AuthorizationView", roles: [frontdesk, ma, manager], screens: [inbox.prior-auth]}
  - {id: getAuthorization, m: GET, p: "/authorizations/{authorizationId}", sum: "Authorization with payer rules", res: AuthorizationView, roles: [frontdesk, ma, manager], screens: [inbox.prior-auth]}
  - {id: createAuthorization, m: POST, p: "/authorizations", sum: "Create an authorization request", body: "create:Authorization", res: "created:Authorization", roles: [frontdesk, ma, manager], screens: [inbox.prior-auth, referrals.worklist], audit: CREATE}
  - {id: updateAuthorization, m: PATCH, p: "/authorizations/{authorizationId}", sum: "Record number, dates and decision", body: "update:Authorization", res: Authorization, roles: [frontdesk, ma, manager], screens: [inbox.prior-auth], audit: UPDATE}
  - {id: submitElectronicPriorAuth, m: POST, p: "/authorizations/{authorizationId}/submit-epa", sum: "Submit drug ePA through the eRx network", res: Authorization, roles: [ma, provider], screens: [inbox.prior-auth, encounter.rx], integ: ErxGateway, audit: DISCLOSE}
