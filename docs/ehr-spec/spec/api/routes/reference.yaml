tag: Reference
description: Code systems and directories. ICD-10-CM, CVX, POS, LOINC, CARC/RARC, NUCC and licensed CPT/HCPCS are loaded into CodeConcept; RxNorm and NPPES are looked up live (RxNav, NPI Registry) and cached.
defaults: {auth: staff, roles: [frontdesk, ma, provider, biller, manager], phi: false}
ops:
  - {id: searchIcd10, m: GET, p: "/reference/icd10", sum: "ICD-10-CM search by plain language or code; includes child codes for specificity prompts", q: [q, billableOnly], res: "list:CodeHit", screens: [encounter.dx-coding, chart.problems, encounter.orders, encounter.charges]}
  - {id: searchSnomed, m: GET, p: "/reference/snomed", sum: "SNOMED CT subset search (problems, allergens, findings)", q: [q], res: "list:CodeHit", screens: [chart.problems, chart.allergies, chart.history]}
  - {id: searchCvx, m: GET, p: "/reference/cvx", sum: "CVX vaccine codes (active and historical)", q: [q], res: "list:CodeHit", screens: [chart.immunizations, encounter.rooming]}
  - {id: listPlaceOfServiceCodes, m: GET, p: "/reference/pos", sum: "CMS place-of-service codes", res: "list:CodeHit", screens: [admin.locations, encounter.charges]}
  - {id: searchLoinc, m: GET, p: "/reference/loinc", sum: "LOINC search (tests, document types, survey items)", q: [q], res: "list:CodeHit", screens: [admin.order-sets, chart.documents, admin.forms]}
  - {id: searchProcedureCodes, m: GET, p: "/reference/procedure-codes", sum: "CPT (licensed) and HCPCS search", q: [q, system], res: "list:CodeHit", roles: [provider, biller, manager], screens: [encounter.charges, billing.estimates, admin.payers-fees, chart.history]}
  - {id: searchAdjustmentCodes, m: GET, p: "/reference/adjustment-codes", sum: "CARC and RARC descriptions", q: [q, system], res: "list:CodeHit", roles: [biller, manager], screens: [billing.era-posting, billing.denials]}
  - {id: searchTaxonomy, m: GET, p: "/reference/taxonomy", sum: "NUCC provider taxonomy", q: [q], res: "list:CodeHit", roles: [manager], screens: [admin.providers]}
  - {id: searchDrugs, m: GET, p: "/reference/drugs", sum: "Drug search via RxNav (approximate match), grouped by ingredient, strength, form", q: [q], res: "list:DrugConcept", roles: [ma, provider], screens: [encounter.rx, chart.medications, chart.allergies], integ: ReferenceDataGateway}
  - {id: getDrug, m: GET, p: "/reference/drugs/{rxcui}", sum: "Drug detail: strengths, NDCs, DEA schedule, ingredients", res: DrugConcept, roles: [ma, provider], screens: [encounter.rx], integ: ReferenceDataGateway}
  - {id: lookupNpi, m: GET, p: "/reference/npi/{npi}", sum: "NPPES lookup for an NPI (provider, organisation, location)", res: NpiRegistryEntry, roles: [frontdesk, biller, manager, provider], screens: [admin.providers, admin.locations, referrals.worklist], integ: ReferenceDataGateway}
  - {id: searchNpiRegistry, m: GET, p: "/reference/npi", sum: "NPPES search by name, taxonomy, city, state (referral recipients, enrolment)", q: [name, taxonomy, city, state, entityType], res: "list:NpiRegistryEntry", roles: [frontdesk, provider, manager], screens: [referrals.worklist, encounter.orders, admin.providers], integ: ReferenceDataGateway}
  - {id: searchDirectAddresses, m: GET, p: "/reference/direct-directory", sum: "Direct addresses for referral recipients", q: [q, state], res: "list:DirectAddress", roles: [frontdesk, provider, manager], screens: [referrals.worklist], integ: DirectGateway}
  - {id: searchPharmacies, m: GET, p: "/reference/pharmacies", sum: "Pharmacy directory (NCPDP) by name or ZIP", q: [q, zip, specialty], res: "list:Pharmacy", roles: [frontdesk, ma, provider], screens: [encounter.rx, chart.demographics, portal.profile], integ: ErxGateway}
  - {id: listCodeSystemVersions, m: GET, p: "/reference/code-systems", sum: "Loaded code-system releases", res: "list:CodeSystemVersion", roles: [manager], screens: [admin.order-sets, admin.payers-fees]}
  - {id: importCodeSystem, m: POST, p: "/reference/code-systems/{system}/imports", sum: "Load a code-system release file (ICD-10-CM, CVX, POS, LOINC, CPT licence, CARC/RARC)", body: multipart, res: job, roles: [manager], screens: [admin.order-sets, admin.payers-fees], integ: ReferenceDataGateway, audit: CREATE}
