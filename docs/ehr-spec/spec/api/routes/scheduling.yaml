tag: Scheduling
description: Calendar, booking, appointment lifecycle (states.yaml#appointment), flow board, rooms, waitlist and recalls. Status changes only through the transition endpoints; each writes an AppointmentStatusEvent.
defaults: {auth: staff, roles: [frontdesk, ma, provider, manager], audit: READ}
ops:
  - {id: listAppointments, m: GET, p: "/appointments", sum: "Appointments in a range (calendar, day lists)", q: [from, to, practitionerId, locationId, status, patientId], res: "page:AppointmentView", screens: [schedule.calendar, chart.timeline, chart.summary, reports.no-shows]}
  - {id: searchAvailability, m: GET, p: "/availability", sum: "Open slots from templates, blocks and bookings", q: [visitTypeId, practitionerId, locationId, modality, fromDate, toDate, timeOfDay], res: SlotSearchResult, screens: [schedule.booking-drawer, schedule.calendar, schedule.checkout, schedule.waitlist], phi: false}
  - {id: bookAppointment, m: POST, p: "/appointments", sum: "Book an appointment (staff); sends confirmation and reminders", body: BookAppointmentRequest, res: "created:AppointmentView", roles: [frontdesk, ma, provider, manager], screens: [schedule.booking-drawer, schedule.checkout, schedule.waitlist, schedule.recall-list], flows: ["flow:access/02"], tr: ["appointment:new->booked"], audit: CREATE, integ: MessagingGateway}
  - {id: approveAppointmentRequest, m: POST, p: "/appointments/{appointmentId}/approve", sum: "Approve a portal appointment request", body: TransitionRequest, res: AppointmentView, roles: [frontdesk, manager], screens: [schedule.appointment-detail, schedule.calendar], tr: ["appointment:requested->booked"], audit: UPDATE}
  - {id: getAppointment, m: GET, p: "/appointments/{appointmentId}", sum: "Appointment with eligibility, reminders and status history", res: AppointmentDetail, screens: [schedule.appointment-detail, schedule.checkout]}
  - {id: updateAppointment, m: PATCH, p: "/appointments/{appointmentId}", sum: "Edit reason, comment, assigned MA", body: "update:Appointment", res: AppointmentView, screens: [schedule.appointment-detail], audit: UPDATE}
  - {id: rescheduleAppointment, m: POST, p: "/appointments/{appointmentId}/reschedule", sum: "Move to a new slot (drag on calendar or booking drawer)", body: RescheduleRequest, res: AppointmentView, roles: [frontdesk, manager], screens: [schedule.calendar, schedule.appointment-detail, schedule.booking-drawer], audit: UPDATE, integ: MessagingGateway}
  - {id: confirmAppointment, m: POST, p: "/appointments/{appointmentId}/confirm", sum: "Mark confirmed (staff call; SMS replies arrive via webhook)", body: TransitionRequest, res: AppointmentView, roles: [frontdesk, manager], screens: [schedule.appointment-detail, home.frontdesk-board], flows: ["flow:access/04"], tr: ["appointment:booked->confirmed"], audit: UPDATE}
  - {id: arriveAppointment, m: POST, p: "/appointments/{appointmentId}/arrive", sum: "Check in: ID verified, consents, payment capture; notifies MA pool", body: ArriveRequest, res: ArriveResult, roles: [frontdesk, manager], screens: [home.frontdesk-board, schedule.appointment-detail], flows: ["flow:checkin/01"], tr: ["appointment:booked->arrived", "appointment:confirmed->arrived"], audit: UPDATE, integ: PaymentGateway, inv: [INV-FIN-01, INV-FIN-02]}
  - {id: roomAppointment, m: POST, p: "/appointments/{appointmentId}/room", sum: "Assign room and MA; opens the encounter", body: RoomRequest, res: EncounterDetail, roles: [ma, manager], screens: [schedule.flow-board, home.clinical-daylist], flows: ["flow:checkin/03"], tr: ["appointment:arrived->roomed"], audit: UPDATE, inv: [INV-ID-01]}
  - {id: markReadyForProvider, m: POST, p: "/appointments/{appointmentId}/ready", sum: "Intake complete; hand off to provider", body: TransitionRequest, res: AppointmentView, roles: [ma], screens: [encounter.rooming], flows: ["flow:checkin/05"], tr: ["appointment:roomed->ready-for-provider"], audit: UPDATE}
  - {id: startVisit, m: POST, p: "/appointments/{appointmentId}/start", sum: "Provider starts the visit", body: TransitionRequest, res: AppointmentView, roles: [provider], screens: [home.provider-worklist, encounter.note, schedule.flow-board], flows: ["flow:encounter/01"], tr: ["appointment:ready-for-provider->with-provider", "appointment:roomed->with-provider"], audit: UPDATE}
  - {id: endVisit, m: POST, p: "/appointments/{appointmentId}/end", sum: "Provider done; patient moves to checkout", body: TransitionRequest, res: AppointmentView, roles: [provider, ma], screens: [encounter.sign, schedule.flow-board, telehealth.visit], tr: ["appointment:with-provider->checkout"], audit: UPDATE}
  - {id: getCheckout, m: GET, p: "/appointments/{appointmentId}/checkout", sum: "Checkout view: follow-up instruction, suggested slots, items to coordinate, AVS, balance", res: CheckoutView, roles: [frontdesk, manager], screens: [schedule.checkout], flows: ["flow:encounter/08"]}
  - {id: completeCheckout, m: POST, p: "/appointments/{appointmentId}/complete", sum: "Complete checkout (optionally book follow-up and release AVS)", body: CheckoutRequest, res: AppointmentView, roles: [frontdesk, manager], screens: [schedule.checkout], flows: ["flow:encounter/08"], tr: ["appointment:checkout->completed"], audit: UPDATE}
  - {id: markNoShow, m: POST, p: "/appointments/{appointmentId}/no-show", sum: "Mark no-show (also run automatically at end of day)", body: TransitionRequest, res: AppointmentView, roles: [frontdesk, manager], screens: [schedule.appointment-detail], tr: ["appointment:booked->no-show", "appointment:confirmed->no-show"], audit: UPDATE}
  - {id: cancelAppointment, m: POST, p: "/appointments/{appointmentId}/cancel", sum: "Cancel with reason; optionally offer slot to waitlist and notify patient", body: CancelAppointmentRequest, res: AppointmentView, roles: [frontdesk, manager], screens: [schedule.appointment-detail], tr: ["appointment:requested->cancelled", "appointment:booked->cancelled", "appointment:confirmed->cancelled"], audit: UPDATE, integ: MessagingGateway}
  - {id: markLeftWithoutBeingSeen, m: POST, p: "/appointments/{appointmentId}/left-without-being-seen", sum: "Patient left before being seen", body: TransitionRequest, res: AppointmentView, roles: [frontdesk, ma], screens: [schedule.flow-board], tr: ["appointment:arrived->left-without-being-seen", "appointment:roomed->left-without-being-seen", "appointment:ready-for-provider->left-without-being-seen"], audit: UPDATE}
  - {id: listAppointmentCommunications, m: GET, p: "/appointments/{appointmentId}/communications", sum: "Reminders sent and replies", res: "list:CommunicationLog", screens: [schedule.appointment-detail]}

  - {id: getFlowBoard, m: GET, p: "/flow-board", sum: "Patients by status with timers, rooms, MAs and over-target flags", q: [date, locationId, practitionerId], res: FlowBoard, screens: [schedule.flow-board], flows: ["flow:checkin/02"]}
  - {id: getRoomBoard, m: GET, p: "/room-board", sum: "Rooms with occupant, status and time", q: [locationId], res: RoomBoard, roles: [ma, manager], screens: [schedule.room-board, schedule.flow-board]}

  - {id: listWaitlist, m: GET, p: "/waitlist", sum: "Waitlist with matching open slots", q: [visitTypeId, practitionerId, status], res: "page:WaitlistView", roles: [frontdesk, manager], screens: [schedule.waitlist, home.frontdesk-board, schedule.calendar]}
  - {id: createWaitlistEntry, m: POST, p: "/waitlist", sum: "Add to waitlist", body: "create:WaitlistEntry", res: "created:WaitlistEntry", roles: [frontdesk, manager], screens: [schedule.waitlist, schedule.booking-drawer], audit: CREATE}
  - {id: removeWaitlistEntry, m: DELETE, p: "/waitlist/{waitlistEntryId}", sum: "Remove from waitlist", res: none, roles: [frontdesk, manager], screens: [schedule.waitlist], audit: UPDATE}
  - {id: offerWaitlistSlot, m: POST, p: "/waitlist/{waitlistEntryId}/offer", sum: "Text an open slot with an accept link", body: SlotOfferRequest, res: WaitlistEntry, roles: [frontdesk, manager], screens: [schedule.waitlist, home.frontdesk-board], integ: MessagingGateway, audit: CREATE}

  - {id: listRecalls, m: GET, p: "/recalls", sum: "Recalls and care-gap outreach due", q: [status, category, practitionerId], res: "page:RecallView", roles: [frontdesk, ma, manager], screens: [schedule.recall-list, home.clinical-daylist]}
  - {id: createRecall, m: POST, p: "/recalls", sum: "Add patients to recall", body: RecallCreateRequest, res: "list:Recall", roles: [frontdesk, ma, provider, manager], screens: [patients.registries, reports.quality, reports.care-gaps], audit: CREATE}
  - {id: logRecallContact, m: POST, p: "/recalls/{recallId}/contacts", sum: "Log an outreach attempt", body: OutreachAttempt, res: Recall, roles: [frontdesk, ma, manager], screens: [schedule.recall-list], audit: CREATE}
  - {id: sendRecallCampaign, m: POST, p: "/recalls/campaigns", sum: "Send booking links by portal and SMS to selected recalls", body: OutreachCampaignRequest, res: job, roles: [frontdesk, ma, manager], screens: [schedule.recall-list], flows: ["flow:quality/02"], integ: MessagingGateway, inv: [INV-SEC-06], audit: CREATE}
