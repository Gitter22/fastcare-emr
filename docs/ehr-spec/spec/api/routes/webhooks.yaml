tag: Webhooks
description: Inbound callbacks from integration vendors. Each request is signature-verified before parsing, deduplicated by vendor event id (WebhookEvent), stored encrypted, acknowledged quickly, and processed by a worker with idempotent handlers (INV-OPS-01). Unmatched or failed items become work items, never silent logs.
defaults: {auth: webhook, phi: true, audit: CREATE}
ops:
  - {id: stediWebhook, m: POST, p: "/webhooks/stedi", sum: "Clearinghouse events: 999/277CA acknowledgements, 835 ERA available, eligibility batch results", body: raw, res: accepted, screens: [billing.claims, billing.rejections, billing.era-posting, billing.eligibility], flows: ["flow:rcm/04", "flow:rcm/06", "flow:access/03"], tr: ["claim:submitted->accepted", "claim:submitted->rejected"], integ: ClearinghouseGateway, inv: [INV-FIN-05, INV-OPS-01]}
  - {id: twilioMessageStatus, m: POST, p: "/webhooks/twilio/status", sum: "SMS delivery status callback", body: form, res: none, screens: [schedule.appointment-detail, chart.communications], integ: MessagingGateway, phi: false}
  - {id: twilioInboundMessage, m: POST, p: "/webhooks/twilio/inbound", sum: "Inbound SMS: C confirms, R requests reschedule, STOP opts out (TCPA), waitlist accept links", body: form, res: twiml, screens: [schedule.appointment-detail, schedule.waitlist, home.frontdesk-board], flows: ["flow:access/04"], tr: ["appointment:booked->confirmed"], integ: MessagingGateway}
  - {id: emailEvents, m: POST, p: "/webhooks/email", sum: "Email delivery, bounce and complaint events from the SMTP relay", body: raw, res: none, screens: [chart.communications], integ: MessagingGateway, phi: false}
  - {id: logicoyWebhook, m: POST, p: "/webhooks/logicoy", sum: "eRx inbound: RxRenewal, RxChange, CancelRx responses, Status/Error, RxFill notifications", body: raw, res: accepted, screens: [inbox.rx-requests, encounter.rx, chart.medications], flows: ["flow:refills/01"], tr: ["task:new->open"], integ: ErxGateway}
  - {id: labWebhook, m: POST, p: "/webhooks/labs/{provider}", sum: "Lab results and order acknowledgements (Health Gorilla, Quest, LabCorp). Ambiguous matches go to the unmatched queue; critical values create escalating tasks.", body: raw, res: accepted, screens: [inbox.results, chart.results, orders.result-reconciliation], flows: ["flow:results/03"], tr: ["order:sent->resulted-prelim", "order:collected->resulted-prelim", "order:sent->resulted-final", "order:collected->resulted-final", "order:resulted-prelim->resulted-final", "order:reviewed->resulted-final"], integ: LabGateway, inv: [INV-SAFE-03, INV-SAFE-04]}
  - {id: directInbound, m: POST, p: "/webhooks/direct", sum: "Inbound Direct messages (consult notes, C-CDA) to the filing queue", body: raw, res: accepted, screens: [inbox.documents, referrals.worklist], flows: ["flow:referral/04"], integ: DirectGateway, inv: [INV-DATA-01]}
  - {id: faxInbound, m: POST, p: "/webhooks/fax", sum: "Inbound fax to the filing queue (OCR and patient suggestion run async)", body: raw, res: accepted, screens: [inbox.documents], integ: FaxGateway}
  - {id: paymentWebhook, m: POST, p: "/webhooks/payments", sum: "Settlement, chargeback and autopay failure events", body: raw, res: none, screens: [billing.patient-account, billing.day-close], integ: PaymentGateway, inv: [INV-FIN-01], phi: false}
  - {id: videoWebhook, m: POST, p: "/webhooks/video", sum: "Participant joined/left, room ended", body: raw, res: none, screens: [telehealth.waiting-room, telehealth.visit], integ: VideoGateway, phi: false}
  - {id: mfaWebhook, m: POST, p: "/webhooks/mfa", sum: "2FA service callbacks (SMS delivery, push approvals) where the provider is callback-based", body: raw, res: none, screens: [auth.mfa-challenge, portal.mfa-challenge], integ: MfaGateway, phi: false}
  - {id: iisAcknowledgement, m: POST, p: "/webhooks/iis", sum: "Immunization registry acknowledgements and query responses (where the registry pushes; otherwise polled)", body: raw, res: accepted, screens: [chart.immunizations], integ: IisGateway}
  - {id: hieNotification, m: POST, p: "/webhooks/hie", sum: "HIE query results and encounter notifications (staged as outside records)", body: raw, res: accepted, screens: [encounter.prechart, chart.problems, chart.medications], integ: HieGateway, inv: [INV-DATA-01]}
