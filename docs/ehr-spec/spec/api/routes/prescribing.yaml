tag: Prescribing
description: Prescription composer, DUR, formulary/RTBC, PDMP, EPCS signing and pharmacy requests through ErxGateway (LogiCoy, NCPDP SCRIPT). Drug search comes from RxNav (see Reference).
defaults: {auth: staff, roles: [ma, provider], audit: READ}
ops:
  - {id: listEncounterPrescriptions, m: GET, p: "/encounters/{encounterId}/medication-requests", sum: "Prescriptions on this encounter", res: "list:MedicationRequest", screens: [encounter.rx, encounter.note, encounter.sign, schedule.checkout]}
  - {id: listPatientPrescriptions, m: GET, p: "/patients/{patientId}/medication-requests", sum: "Prescription history", q: [status], res: "page:MedicationRequest", screens: [chart.medications, portal.messages]}
  - {id: createPrescription, m: POST, p: "/encounters/{encounterId}/medication-requests", sum: "Start a prescription draft (MA may pend for provider)", body: "create:MedicationRequest", res: "created:MedicationRequest", screens: [encounter.rx, encounter.note, chart.medications, inbox.results], flows: ["flow:encounter/05"], audit: CREATE}
  - {id: updatePrescription, m: PATCH, p: "/medication-requests/{medicationRequestId}", sum: "Edit a draft prescription", body: "update:MedicationRequest", res: MedicationRequest, screens: [encounter.rx], audit: UPDATE}
  - {id: checkPrescription, m: POST, p: "/medication-requests/{medicationRequestId}/checks", sum: "Run DUR (allergy, interaction, dose, duplicate), formulary/RTBC, alternatives and PDMP requirement", res: RxCheckResult, screens: [encounter.rx], integ: ErxGateway, inv: [INV-SAFE-06, INV-SAFE-05]}
  - {id: decideDurAlert, m: POST, p: "/dur-alerts/{durAlertId}/decision", sum: "Switch to an alternative, remove, or override with a required reason", body: DurDecision, res: DurAlert, roles: [provider], screens: [encounter.rx], audit: UPDATE, inv: [INV-SAFE-06]}
  - {id: queryPdmp, m: POST, p: "/patients/{patientId}/pdmp-queries", sum: "Query the state PDMP", body: PdmpQueryRequest, res: PdmpQuery, roles: [provider], screens: [encounter.rx], integ: PdmpGateway, audit: QUERY, inv: [INV-SAFE-05]}
  - {id: getPdmpReport, m: GET, p: "/pdmp-queries/{pdmpQueryId}/report", sum: "PDMP report", res: file, roles: [provider], screens: [encounter.rx], audit: READ}
  - {id: signPrescription, m: POST, p: "/medication-requests/{medicationRequestId}/sign", sum: "Sign and send NewRx; controlled substances require EPCS two-factor and a PDMP check or exception", body: SignPrescriptionRequest, res: MedicationRequest, roles: [provider], stepup: conditional, screens: [encounter.rx, inbox.rx-requests], flows: ["flow:encounter/05"], integ: ErxGateway, audit: SIGN, inv: [INV-SAFE-01, INV-SAFE-05, INV-SAFE-06, INV-ID-03]}
  - {id: cancelPrescription, m: POST, p: "/medication-requests/{medicationRequestId}/cancel", sum: "Send CancelRx to the pharmacy", body: ReasonRequest, res: MedicationRequest, roles: [provider], screens: [chart.medications, encounter.rx], integ: ErxGateway, audit: UPDATE}

  - {id: listRxRequests, m: GET, p: "/inbox/rx-requests", sum: "Pharmacy renewal/change requests and portal refills with protocol result", q: [poolId, status], res: "page:RxRequestView", screens: [inbox.rx-requests, home.provider-worklist, home.clinical-daylist], flows: ["flow:refills/03"]}
  - {id: getRxRequest, m: GET, p: "/rx-requests/{rxRequestId}", sum: "Request with original prescription, last visit, labs, BP and fill history", res: RxRequestView, screens: [inbox.rx-requests]}
  - {id: pendRxRequest, m: POST, p: "/rx-requests/{rxRequestId}/pend", sum: "MA pends the request to the provider (protocol passed)", body: CommentRequest, res: RxRequestView, roles: [ma], screens: [inbox.rx-requests], flows: ["flow:refills/03"], tr: ["task:open->pended-to-provider", "task:in-progress->pended-to-provider"], audit: UPDATE}
  - {id: approveRxRequest, m: POST, p: "/rx-requests/{rxRequestId}/approve", sum: "Approve (optionally modified) and send the response", body: RxRequestApproval, res: RxRequestView, roles: [provider], screens: [inbox.rx-requests], flows: ["flow:refills/04"], tr: ["task:pended-to-provider->completed", "task:open->completed"], integ: ErxGateway, audit: SIGN, inv: [INV-SAFE-01, INV-SAFE-06]}
  - {id: denyRxRequest, m: POST, p: "/rx-requests/{rxRequestId}/deny", sum: "Deny with reason (pharmacy and patient notified)", body: ReasonRequest, res: RxRequestView, roles: [provider], screens: [inbox.rx-requests], tr: ["task:pended-to-provider->completed", "task:open->completed"], integ: ErxGateway, audit: SIGN}
