# Request and response shapes that are not a single Prisma model. tools/build-openapi.mjs expands this into
# components.schemas next to the schemas it generates from data/schema.prisma (Model, ModelCreate, ModelUpdate, enums).
#
# Field type grammar
#   string text uuid int number money bool date datetime time email phone uri password binary json
#   Name        $ref to a Prisma model, Prisma enum or another DTO in this file
#   T[]         array of T
#   T?          optional (omitted from `required`)
#   a|b|c       inline string enum (lower-case wire values)
#   {k: T}      inline object, same grammar
#   =Value      constant
# Keys starting with `_` are not fields: `_` = description, `_base` = allOf with a model or DTO, `_phi` = false marks a
# shape that never carries PHI (default: inherits the operation's x-phi).
# money = decimal string ("123.45"); never a float.

# ---------- shared ----------
ReasonRequest: {reason: text}
IdsRequest: {ids: "uuid[]"}
CommentRequest: {comment: text}
DateRangeRequest: {from: date, to: date}
TextRequest: {text: text}
ChannelRequest: {channel: CommChannel, to: string?}
TransitionRequest:
  _: Generic state change. The server checks the transition exists in spec/states.yaml and the caller's role may perform it.
  to: string
  reason: text?
  version: int
SnoozeRequest: {until: datetime, reason: text?}
AssignRequest: {assigneeUserId: uuid?, workPoolId: uuid?, note: text?}
BulkResult:
  succeeded: "uuid[]"
  failed: "{id: uuid, code: string, detail: string}[]"
ExportRequest:
  _: One export job. CSV takes a report key and filters; EHI_PATIENT and C_CDA take patientId; BULK_FHIR and EHI_PRACTICE cover the practice.
  type: ExportType
  report: string?
  filters: json?
  patientId: uuid?
  since: datetime?
  reason: text
HealthStatus: {_phi: false, status: ok|degraded|down, version: string, checks: "{name: string, status: ok|degraded|down}[]"}

# ---------- auth (staff and portal) ----------
LoginRequest: {_phi: false, email: email, password: password, deviceName: string?}
LoginResult:
  _phi: false
  _: Password accepted. MFA is always required (INV-SEC-04); either a challenge or, with no factor yet, an enrolment token.
  next: mfa|enroll
  challengeId: uuid?
  factors: "MfaFactorInfo[]?"
  defaultFactorId: uuid?
  enrollmentToken: string?
  passwordExpired: bool
SessionTokens:
  _phi: false
  _: Access token in the body; refresh token only as an httpOnly, Secure, SameSite=Strict cookie.
  accessToken: string
  tokenType: "=Bearer"
  expiresIn: int
  idleTimeoutSeconds: int
  absoluteExpiresAt: datetime
ChallengeRef: {_phi: false, challengeId: uuid, factorId: uuid?}
MfaVerifyRequest: {_phi: false, challengeId: uuid, factorId: uuid?, code: string?, webauthnAssertion: json?, recoveryCode: string?, rememberDevice: bool?}
