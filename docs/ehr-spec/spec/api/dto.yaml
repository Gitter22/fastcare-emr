PasswordCandidate: {_phi: false, password: password, email: email?}
PasswordCheckResult: {_phi: false, ok: bool, score: int, failures: "minLength|breached|containsName|reused[]"}
PasswordResetRequest: {_phi: false, token: string, newPassword: password}
PasswordChangeRequest: {_phi: false, currentPassword: password, newPassword: password}
InvitationInfo: {_phi: false, practiceName: string, email: email, name: string, roles: "Role[]", expiresAt: datetime}
AcceptInvitationRequest: {_phi: false, password: password, acceptTerms: bool}
EnrollmentToken: {_phi: false, enrollmentToken: string, expiresAt: datetime}
SessionInfo: {_phi: false, id: uuid, current: bool, deviceName: string?, userAgent: string?, ipAddress: string?, createdAt: datetime, lastSeenAt: datetime}
AuditEventEntry:
  id: string
