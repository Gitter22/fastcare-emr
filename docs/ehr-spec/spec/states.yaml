# State machines. `label` is the only text the UI may show for a state (INV-DATA-03).
# `new` is the pseudo-state before creation. Transitions not listed are forbidden and must be rejected server-side.
# guard: condition that must hold. by: roles allowed to trigger (omit = system or any role with access).
machines:
  - id: appointment
    states:
      - {id: new, label: "—"}
      - {id: requested, label: Requested}
      - {id: booked, label: Booked}
      - {id: confirmed, label: Confirmed}
      - {id: arrived, label: Arrived}
      - {id: roomed, label: Roomed}
      - {id: ready-for-provider, label: Ready for provider}
      - {id: with-provider, label: With provider}
      - {id: checkout, label: Checkout}
      - {id: completed, label: Completed}
      - {id: no-show, label: No-show}
      - {id: cancelled, label: Cancelled}
      - {id: left-without-being-seen, label: Left without being seen}
    transitions:
      - {from: [new], to: requested, by: [patient]}
      - {from: [new, requested], to: booked, by: [frontdesk, patient], guard: slot available per visit type rules}
      - {from: [booked], to: confirmed}
      - {from: [booked, confirmed], to: arrived, by: [frontdesk, patient], guard: appointment date is today}
      - {from: [arrived], to: roomed, by: [ma]}
      - {from: [roomed], to: ready-for-provider, by: [ma]}
      - {from: [ready-for-provider, roomed], to: with-provider, by: [provider]}
      - {from: [with-provider], to: checkout, by: [provider, ma]}
      - {from: [checkout], to: completed, by: [frontdesk]}
      - {from: [booked, confirmed], to: no-show, guard: end of day without arrival}
      - {from: [requested, booked, confirmed], to: cancelled, by: [frontdesk, patient]}
      - {from: [arrived, roomed, ready-for-provider], to: left-without-being-seen, by: [frontdesk, ma]}

  - id: note
    states:
      - {id: new, label: "—"}
      - {id: draft, label: Draft}
      - {id: ready-to-sign, label: Ready to sign}
      - {id: pending-cosign, label: Pending co-sign}
      - {id: signed, label: Signed}
      - {id: addended, label: Addended}
    transitions:
      - {from: [new], to: draft, by: [ma, provider]}
      - {from: [draft], to: ready-to-sign, by: [ma, provider]}
      - {from: [draft, ready-to-sign], to: signed, by: [provider], guard: pre-flight passes and no co-sign rule applies, invariants: [INV-SAFE-08, INV-DATA-02]}
      - {from: [draft, ready-to-sign], to: pending-cosign, by: [provider], guard: co-sign rule applies}
      - {from: [pending-cosign], to: signed, by: [provider], guard: signer is supervising provider}
      - {from: [signed, addended], to: addended, by: [provider], invariants: [INV-SAFE-02]}

  - id: order
    states:
      - {id: new, label: "—"}
      - {id: pended, label: Pended}
      - {id: signed, label: Signed}
      - {id: sent, label: Sent}
      - {id: collected, label: Collected}
      - {id: resulted-prelim, label: Preliminary result}
      - {id: resulted-final, label: Final result}
      - {id: reviewed, label: Reviewed}
      - {id: cancelled, label: Cancelled}
    transitions:
      - {from: [new], to: pended, by: [ma, provider]}
      - {from: [new, pended], to: signed, by: [provider], invariants: [INV-SAFE-01, INV-ID-03]}
      - {from: [signed], to: sent}
      - {from: [sent], to: collected, by: [ma]}
      - {from: [sent, collected], to: resulted-prelim}
      - {from: [sent, collected, resulted-prelim], to: resulted-final}
      - {from: [resulted-final], to: reviewed, by: [provider]}
      - {from: [reviewed], to: resulted-final, guard: corrected result received}
      - {from: [pended, signed, sent], to: cancelled, by: [provider, ma]}

  - id: claim
    states:
      - {id: new, label: "—"}
      - {id: draft, label: Draft}
      - {id: ready, label: Ready}
      - {id: submitted, label: Submitted}
      - {id: accepted, label: Accepted}
      - {id: rejected, label: Rejected}
      - {id: paid, label: Paid}
      - {id: partially-paid, label: Partially paid}
      - {id: denied, label: Denied}
      - {id: appealed, label: Appealed}
      - {id: closed, label: Closed}
    transitions:
      - {from: [new], to: draft}
      - {from: [draft], to: ready, guard: scrubber passes, invariants: [INV-FIN-03]}
      - {from: [ready], to: submitted}
      - {from: [submitted], to: accepted}
      - {from: [submitted], to: rejected, invariants: [INV-FIN-05]}
      - {from: [rejected], to: submitted, by: [biller]}
      - {from: [accepted, appealed], to: paid}
      - {from: [accepted], to: partially-paid}
      - {from: [accepted, appealed], to: denied, invariants: [INV-FIN-05]}
      - {from: [denied, partially-paid], to: appealed, by: [biller]}
      - {from: [denied], to: submitted, by: [biller], guard: corrected claim}
      - {from: [paid, partially-paid, denied], to: closed, by: [biller], guard: zero insurance balance or approved write-off}

  - id: task
    states:
      - {id: new, label: "—"}
      - {id: open, label: Open}
      - {id: in-progress, label: In progress}
      - {id: pended-to-provider, label: Waiting on provider}
      - {id: completed, label: Completed}
      - {id: escalated, label: Escalated}
    transitions:
      - {from: [new], to: open}
      - {from: [open, escalated], to: in-progress}
      - {from: [open, in-progress], to: pended-to-provider, by: [ma, frontdesk]}
      - {from: [open, in-progress, pended-to-provider, escalated], to: completed, guard: critical-result tasks need contact note, invariants: [INV-SAFE-04]}
      - {from: [open, in-progress, pended-to-provider], to: escalated, guard: past due}

  - id: referral
    states:
      - {id: new, label: "—"}
      - {id: ordered, label: Ordered}
      - {id: auth-pending, label: Authorization pending}
      - {id: sent, label: Sent}
      - {id: scheduled, label: Scheduled}
      - {id: consult-received, label: Consult received}
      - {id: closed, label: Closed}
      - {id: cancelled, label: Cancelled}
    transitions:
      - {from: [new], to: ordered, by: [provider]}
      - {from: [ordered], to: auth-pending, by: [frontdesk]}
      - {from: [ordered, auth-pending], to: sent, by: [frontdesk]}
      - {from: [sent], to: scheduled, by: [frontdesk]}
      - {from: [sent, scheduled], to: consult-received}
      - {from: [consult-received], to: closed, by: [provider]}
      - {from: [ordered, auth-pending, sent, scheduled], to: cancelled, by: [provider, frontdesk]}
