  - {id: folder-results, type: link, label: "Results", bind: "count", go: inbox.results, when: "role ma or provider"}
  - {id: folder-rx, type: link, label: "Rx requests", bind: "count", go: inbox.rx-requests, when: "role ma or provider"}
  - {id: folder-cosign, type: link, label: "Co-sign", bind: "count", go: inbox.cosign, when: "role provider"}
  - {id: folder-messages, type: link, label: "Patient messages", bind: "count", go: inbox.patient-messages}
  - {id: folder-tasks, type: link, label: "Tasks", bind: "count", go: inbox.tasks}
  - {id: folder-previsit, type: link, label: "Pre-visit changes", bind: "count", go: inbox.previsit-queue, when: "role frontdesk or ma"}
  - {id: folder-documents, type: link, label: "Documents", bind: "count", go: inbox.documents, when: "role frontdesk or ma"}
  - {id: folder-prior-auth, type: link, label: "Prior auth", bind: "count", go: inbox.prior-auth, when: "role frontdesk or ma"}
  - {id: folder-collection, type: link, label: "Specimen collection", bind: "count", go: orders.collection, when: "role ma"}
  - {id: folder-overdue, type: link, label: "Overdue orders", bind: "count", go: orders.tracking, when: "role ma or provider"}
  - {id: folder-unmatched, type: link, label: "Unmatched results", bind: "count", go: orders.result-reconciliation, when: "role ma or manager"}
  - {id: folder-referrals, type: link, label: "Referrals", bind: "count", go: referrals.worklist, when: "role frontdesk"}

