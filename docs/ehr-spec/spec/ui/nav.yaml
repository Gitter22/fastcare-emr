roots:
  staff: [home.frontdesk-board, home.clinical-daylist, home.provider-worklist, home.rcm-queues, home.practice-kpis]
  patient: [portal.home]
  overlays: [global.command-bar, global.notifications, auth.step-up]
  public: [auth.sign-in, portal.sign-in]
  emailed-links: [auth.reset-password, auth.accept-invite, portal.reset-password, portal.activate]

rules:
  - id: NAV-01
    rule: Every route is deep-linkable and survives refresh. Browser back pops history.
  - id: NAV-02
    rule: The Up link (breadcrumb, back-to-list link) goes to the screen's `up`, keeping that screen's last filters and scroll.
  - id: NAV-03
    rule: Views (drawer, modal, pane) close back to the underlying view. A view has its own URL fragment (e.g. ?view=arrive) so it can be linked and survives refresh.
  - id: NAV-04
    rule: Any patient link opens the chart context (/patient/:patientId/summary) as a chart tab. Opening a second patient adds a tab, up to OPEN-Q9; the oldest unpinned tab closes first. Closing the last chart tab returns to the last non-chart route.
  - id: NAV-05
    rule: Encounter section tabs are sibling routes under /patient/:patientId/encounter/:encounterId/. Leaving keeps the draft; the encounter stays reachable from the chart tab and the provider worklist.
  - id: NAV-06
    rule: Blocking modals (alerts, pre-sign checks) cannot be dismissed with Esc or scrim click; the user picks an action.
  - id: NAV-07
    rule: Navigating away from a form with unsaved, non-autosaved changes asks to keep editing or discard.
  - id: NAV-08
    rule: The command bar (⌘K / Ctrl+K) can open any patient, any screen the role may see, and named actions (Book, New patient, New message).
  - id: NAV-09
    rule: Rail and folder items a role cannot use are hidden, not disabled. Deep links to them show permission-denied.
  - id: NAV-10
    rule: Session timeout returns to sign-in and then to the same route with drafts restored (INV-SEC-04).
