# Global navigation. Shared nav blocks referenced by patterns ("nav.yaml#<block>").
# go may be a screen id, screen#view, or {by_role: {role: target}} for role-dependent destinations.

rail:
  - {id: rail-home, type: link, label: "Home", go: {by_role: {frontdesk: home.frontdesk-board, ma: home.clinical-daylist, provider: home.provider-worklist, biller: home.rcm-queues, manager: home.practice-kpis}}}
  - {id: rail-schedule, type: link, label: "Schedule", go: schedule.calendar}
  - {id: rail-patients, type: link, label: "Patients", go: patients.search}
  - {id: rail-inbox, type: link, label: "Inbox", bind: "count Task open for user + pools", go: {by_role: {frontdesk: inbox.previsit-queue, ma: inbox.patient-messages, provider: inbox.results, biller: inbox.tasks, manager: inbox.tasks}}}
  - {id: rail-billing, type: link, label: "Billing", go: {by_role: {frontdesk: billing.eligibility, biller: billing.charge-review, manager: billing.day-close}}, when: "role frontdesk, biller or manager"}
  - {id: rail-reports, type: link, label: "Reports", go: {by_role: {provider: reports.quality, biller: reports.ar-aging, manager: reports.quality, frontdesk: reports.no-shows, ma: reports.care-gaps}}}
  - {id: rail-telehealth, type: link, label: "Telehealth", go: telehealth.waiting-room, when: "role ma or provider"}
  - {id: rail-admin, type: link, label: "Admin", go: admin.users-roles, when: "role manager"}

topbar:
  - {id: practice-name, type: text, bind: Practice.name}
  - {id: location-switch, type: select, label: "Location", bind: "Location[] user may work at"}
  - {id: command-bar-trigger, type: button, label: "Search patients, screens, actions (⌘K)", go: global.command-bar}
  - {id: notifications-bell, type: icon-button, label: "Notifications", bind: "count Notification unread", go: global.notifications}
  - {id: inbox-count, type: chip, bind: "count Task open", go: {by_role: {frontdesk: inbox.previsit-queue, ma: inbox.patient-messages, provider: inbox.results, biller: inbox.tasks, manager: inbox.tasks}}}
  - {id: user-security, type: link, label: "Account security", go: auth.account-security}
  - {id: user-menu, type: menu, label: "User", bind: "Practitioner/User current + active role", does: "switch active role; preferences; sign out"}

inbox-folders:
