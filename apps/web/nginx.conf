server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Lab report / chart export uploads go through this proxy.
    client_max_body_size 25m;

    # Production axios uses baseURL "/api". Vite's dev proxy does not exist
    # in this image, so nginx must forward API calls to the backend.
    location /api {
        proxy_pass http://agile-emr-backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_request_headers on;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router paths (/login, /consent/sign, /portal, ...) are not
    # real files. Fall back to index.html so the SPA can handle them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
